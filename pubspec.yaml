name: ponto_study
description: "Ponto Study - aplicativo local de controle e planejamento de estudos"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados local (SQLite) com suporte a Android, Windows e Web.
  # Escolhido no lugar do sqflite "puro" porque o Drift usa a MESMA API
  # para as três plataformas, é fortemente tipado e atualiza a UI
  # automaticamente quando os dados mudam (streams reativas).
  drift: ^2.16.0

  # Implementação nativa do SQLite para Android/Windows/Linux/macOS.
  sqlite3_flutter_libs: ^0.5.24

  # Encontrar a pasta correta do dispositivo para salvar o arquivo .sqlite
  path_provider: ^2.1.3
  path: ^1.9.0

  # Ícones bonitos e consistentes (usados nas matérias e na navegação)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Gera o código repetitivo do Drift (database.g.dart) a partir das
  # tabelas que escrevemos em database/tables.dart
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

  # Usado SÓ pelos testes (test/), para abrir um banco SQLite em
  # memória (sem precisar do Android/Windows real rodando).
  sqlite3: ^2.4.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
