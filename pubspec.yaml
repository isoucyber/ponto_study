name: ponto_study
description: "Ponto Study - plataforma local de estudos, aprendizagem e domínio de conhecimento"
publish_to: 'none'

# Versão do app. O número depois do "+" é o "código de versão" do Android
# (precisa aumentar a cada versão publicada).
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Traduções do Flutter (calendário, botões "Cancelar"/"OK" etc.) em português.
  flutter_localizations:
    sdk: flutter

  # Banco de dados SQLite local, tipado, com migrações.
  drift: ^2.16.0
  # SQLite nativo empacotado para Android e Windows.
  sqlite3_flutter_libs: ^0.5.24
  # Encontra a pasta correta do sistema para salvar o banco.
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Gera o código do banco (database.g.dart) a partir das tabelas.
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  # Gera os ícones do app para Android e Windows a partir de assets/icon/.
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Configuração do gerador de ícones (executado no GitHub Actions).
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F1A14"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
