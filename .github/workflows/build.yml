name: Testes, builds e Release

# ============================================================
# ARQUIVO: .github/workflows/build.yml
# FUNÇÃO: Automação no GitHub Actions.
#   - A cada push: roda análise + testes e compila Android e Windows.
#     Os arquivos ficam em "Actions → execução → Artifacts".
#   - No branch main: se a versão do pubspec.yaml ainda não foi
#     publicada, cria a tag vX.Y.Z e a Release com o instalador .exe,
#     o .apk, a versão portátil e o código-fonte em .zip.
#
# Para publicar uma versão nova:
#   1. Atualize "version:" no pubspec.yaml e o CHANGELOG.md
#   2. Crie docs/releases/vX.Y.Z.md com as notas da versão
#   3. Envie para o main (git push). O resto é automático.
# ============================================================

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: SQLite para os testes do banco
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev
      - name: Dependências
        run: flutter pub get
      - name: Gerar código do banco (Drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes automatizados
        run: flutter test --reporter expanded --timeout 120s

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Versão do app
        run: |
          echo "APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Preparar plataforma Android
        run: bash tool/prepare_platforms.sh android
      - name: Compilar APK
        run: flutter build apk --release
      - name: Organizar arquivo
        run: |
          mkdir -p dist/Android
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Android/PontoStudy-${APP_VERSION}.apk"
          ls -la dist/Android
      - name: Assinar APK com a chave fixa (se configurada nos Secrets)
        # Com a chave fixa, o Android aceita atualizar o app sem desinstalar.
        # Como configurar: docs/ASSINATURA_ANDROID.md
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK="dist/Android/PontoStudy-${APP_VERSION}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" "$APK"
            rm -f "$RUNNER_TEMP/upload.jks"
            echo "APK assinado com a chave fixa do Ponto Study."
          else
            echo "::warning::Chave fixa não configurada: APK assinado com chave temporária (veja docs/ASSINATURA_ANDROID.md)."
          fi
      - name: Verificar APK (assinatura, nome e pacote)
        run: |
          APK="dist/Android/PontoStudy-${APP_VERSION}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion"
          "$BT/aapt2" dump badging "$APK" | grep -q "application-label:'Ponto Study'"
      - uses: actions/upload-artifact@v4
        with:
          name: PontoStudy-Android
          path: dist/Android/
          if-no-files-found: error

  windows:
    name: Windows (instalador .exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Versão do app
        shell: bash
        run: |
          echo "APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '\r')" >> "$GITHUB_ENV"
      - name: Preparar plataforma Windows
        shell: bash
        run: bash tool/prepare_platforms.sh windows
      - name: Compilar aplicativo Windows
        run: flutter build windows --release
      - name: Incluir bibliotecas do Visual C++ (para rodar em qualquer PC)
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$dll" $dest -Force
          }
          Get-ChildItem $dest
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Gerar instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\ponto_study.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar versão portátil (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Windows\PontoStudy-$env:APP_VERSION-Windows-portatil.zip" -Force
          Get-ChildItem dist\Windows
      - name: Teste de fumaça (o .exe abre e continua rodando)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\ponto_study.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "O aplicativo fechou sozinho (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: o aplicativo abriu e ficou em execução por 15 segundos."
      - name: Teste do instalador e da interface (instala, digita o nome, reabre)
        shell: pwsh
        run: ./tool/windows_smoke_test.ps1
      - name: Capturas de tela do teste (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Windows
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: PontoStudy-Windows
          path: dist/Windows/
          if-no-files-found: error

  android-test:
    name: Android (teste no emulador)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: PontoStudy-Android
          path: apk
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e testar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_smoke_test.sh apk
      - name: Capturas de tela do teste (Android)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Android
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publicar Release
    # Publica automaticamente quando o código chega ao branch main com uma
    # versão (pubspec.yaml) que ainda não tem Release. Cria a tag vX.Y.Z.
    if: github.ref == 'refs/heads/main'
    needs: [android, windows, android-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versão e verificação da tag
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A versão v$V já foi publicada: nada a fazer."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          path: dist
          pattern: PontoStudy-*
      - name: Código-fonte completo (.zip) e notas da versão
        if: steps.ver.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git archive --format=zip --prefix=ponto_study/ -o "dist/PontoStudy-${TAG}-codigo-fonte.zip" HEAD
          find dist -type f -exec ls -la {} \;
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" release_notes.md
          else
            echo "Versão ${TAG} do Ponto Study." > release_notes.md
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ponto Study ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          make_latest: true
          files: |
            dist/PontoStudy-Windows/*
            dist/PontoStudy-Android/*
            dist/*.zip
